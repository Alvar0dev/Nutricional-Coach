spring.application.name=nutricional-coach
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties]

# DataSource (H2 in-memory fallback for local development; override via DB_* for AWS RDS)
spring.datasource.url=${DB_URL:jdbc:h2:mem:nutricionaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# AWS Configuration (RDS / S3)
aws.region=${AWS_REGION:eu-west-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.bucket=${AWS_S3_BUCKET:nutricional-coach-pdfs}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.pathStyleAccess=${AWS_S3_PATH_STYLE_ACCESS:false}
