<h2>Nuevo paciente</h2>

<form (ngSubmit)="guardar()" #f="ngForm">
  <div class="campo">
    <label for="nombre">Nombre *</label>
    <input id="nombre" name="nombre" type="text" [(ngModel)]="paciente.nombre" required />
  </div>

  <div class="campo">
    <label for="apellidos">Apellidos</label>
    <input id="apellidos" name="apellidos" type="text" [(ngModel)]="paciente.apellidos" />
  </div>

  <div class="campo">
    <label for="email">Email *</label>
    <input id="email" name="email" type="email" [(ngModel)]="paciente.email" required />
  </div>

  <div class="campo">
    <label for="telefono">Teléfono</label>
    <input id="telefono" name="telefono" type="tel" [(ngModel)]="paciente.telefono" />
  </div>

  <div class="campo">
    <label for="objetivo">Objetivo</label>
    <input id="objetivo" name="objetivo" type="text" [(ngModel)]="paciente.objetivo" />
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <button type="submit" [disabled]="cargando">{{ cargando ? 'Guardando...' : 'Dar de alta' }}</button>
  <button type="button" (click)="irListado()">Cancelar</button>
</form>

<div *ngIf="exito" class="exito">
  {{ exito }}
  <button type="button" (click)="irListado()">Ver listado</button>
</div>
