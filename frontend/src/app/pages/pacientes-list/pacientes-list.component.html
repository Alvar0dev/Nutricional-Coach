<h2>Pacientes</h2>

<button type="button" (click)="irNuevo()">Nuevo paciente</button>

<div *ngIf="error" class="error">{{ error }}</div>

<div *ngIf="cargando">Cargando pacientes...</div>

<table *ngIf="!cargando && pacientes.length > 0">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Teléfono</th>
      <th>Objetivo</th>
      <th>Fecha alta</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let paciente of pacientes">
      <td>{{ paciente.nombre }} {{ paciente.apellidos }}</td>
      <td>{{ paciente.email }}</td>
      <td>{{ paciente.telefono || '-' }}</td>
      <td>{{ paciente.objetivo || '-' }}</td>
      <td>{{ paciente.fechaAlta || '-' }}</td>
      <td>
        <button type="button" (click)="verDetalle(paciente.id!)">Ver detalle</button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="!cargando && !error && pacientes.length === 0">No hay pacientes registrados.</div>
